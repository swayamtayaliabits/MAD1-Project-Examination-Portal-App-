{% extends "base.html" %}
{% block content %}
<div class="p-5 bg-white border rounded">
    <h1>Examination Management Portal</h1>
    <p class="lead">Courses, examinations, examiner slots and student bookings in one place.</p>
    {% if not current_user.is_authenticated %}
        <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Log in</a>
        <a class="btn btn-outline-primary" href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
</div>
{% endblock %}
